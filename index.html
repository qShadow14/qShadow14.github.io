<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIG Project Coming Soon</title>

<!-- Added Modern Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #040405;
    --gold: #e7b866;
    --gold-hot: #ffd68a;
    --gold-dim: #7a5f34;
    --text-hi: #f5f2ea;
    --text-lo: #8f8d97;
    --line: rgba(231,184,102,0.18);
    --glass: rgba(18,17,20,0.65);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text-hi);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* ---------- Ambient Cursor Glow ---------- */
  .cursor-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(231,184,102,0.08) 0%, rgba(231,184,102,0) 70%);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: screen;
    transition: opacity 0.3s ease;
  }

  /* ---------- Background Layers ---------- */
  canvas#globe {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-46%);
    z-index: 0;
    pointer-events: none;
    opacity: 0.8;
  }
  canvas#comet {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: 
      radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(1px 1px at 82% 15%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(2px 2px at 62% 8%, rgba(255,214,138,0.6), transparent 60%),
      radial-gradient(1px 1px at 28% 78%, rgba(255,255,255,0.4), transparent 60%),
      radial-gradient(1px 1px at 92% 65%, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(2px 2px at 45% 88%, rgba(231,184,102,0.4), transparent 60%);
    pointer-events: none;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: radial-gradient(ellipse 120% 100% at 50% 50%, transparent 40%, #040405 95%);
    pointer-events: none;
  }

  .horizon {
    position: fixed;
    left: 50%;
    bottom: -40vh;
    width: 160vw;
    height: 74vh;
    transform: translateX(-50%);
    z-index: 2;
    border-radius: 50%;
    background: radial-gradient(ellipse closest-side, rgba(231,184,102,0.4), rgba(231,184,102,0.1) 42%, transparent 68%);
    filter: blur(4px);
    pointer-events: none;
    animation: breathe 8s ease-in-out infinite alternate;
  }
  @keyframes breathe {
    0% { opacity: 0.6; transform: translateX(-50%) scaleY(1); }
    100% { opacity: 1; transform: translateX(-50%) scaleY(1.05); }
  }

  /* ---------- Content ---------- */
  .wrap {
    position: relative;
    z-index: 4;
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 40px;
  }

  .reveal {
    opacity: 0;
    transform: translateY(20px);
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-hi);
    background: rgba(255, 255, 255, 0.03);
    padding: 8px 16px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(4px);
    animation-delay: 0.1s;
  }

  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold-hot);
    box-shadow: 0 0 12px 2px rgba(255,214,138,0.9);
    position: relative;
    flex-shrink: 0;
  }
  .pulse-dot::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid var(--gold-hot);
    opacity: 0;
    animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
  }
  @keyframes ping {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  h1.title {
    font-weight: 300;
    font-size: clamp(28px, 4vw, 42px);
    letter-spacing: -0.01em;
    color: var(--text-hi);
    text-wrap: balance;
    animation-delay: 0.2s;
  }
  h1.title strong {
    font-weight: 700;
    background: linear-gradient(110deg, var(--gold-dim), var(--gold-hot) 35%, #ffffff 50%, var(--gold-hot) 65%, var(--gold-dim));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(231,184,102,0.2);
    animation: shimmer 4s linear infinite;
  }
  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  /* ---------- Ticker ---------- */
  .ticker {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 16px;
    width: 100%;
    animation-delay: 0.3s;
  }

  .seg {
    background: linear-gradient(180deg, rgba(30,28,34,0.7) 0%, rgba(18,17,20,0.5) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line);
    border-top: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 24px 8px 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    perspective: 400px;
    transition: transform 0.3s ease;
  }
  .seg:hover {
    transform: translateY(-5px);
  }
  
  .seg::before {
    content: '';
    position: absolute;
    top: -50%; left: -20%;
    width: 140%; height: 100%;
    background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 60%);
    pointer-events: none;
  }

  .num {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 54px);
    line-height: 1;
    color: var(--text-hi);
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    display: inline-block;
    transform-style: preserve-3d;
  }
  .num.flip { animation: flip 0.4s ease-in-out; }
  @keyframes flip {
    0% { transform: rotateX(0deg); opacity: 1; }
    50% { transform: rotateX(90deg); opacity: 0.5; }
    51% { transform: rotateX(-90deg); opacity: 0.5; }
    100% { transform: rotateX(0deg); opacity: 1; }
  }

  .seg.tick {
    border-color: rgba(231,184,102,0.6);
    border-top-color: var(--gold-hot);
    box-shadow: 
      0 0 40px rgba(231,184,102,0.15),
      0 15px 35px rgba(0,0,0,0.6);
  }
  .seg.tick .num {
    color: var(--gold-hot);
    text-shadow: 0 0 20px rgba(255,214,138,0.4);
  }

  .unit {
    margin-top: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-lo);
  }

  @media (max-width: 768px) {
    .ticker { grid-template-columns: repeat(3, 1fr); row-gap: 16px; gap: 12px; }
  }

  .sub {
    font-size: 16px;
    color: var(--text-lo);
    max-width: 560px;
    line-height: 1.7;
    animation-delay: 0.4s;
    font-weight: 300;
  }

  /* ---------- Email Capture ---------- */
  .capture {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation-delay: 0.5s;
  }

  form.mail {
    display: flex;
    width: 100%;
    background: rgba(10, 10, 12, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 8px;
    gap: 8px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 10px 40px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
  }
  form.mail:focus-within {
    border-color: rgba(231,184,102,0.8);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 40px rgba(231,184,102,0.2);
    background: rgba(20, 20, 22, 0.8);
  }

  form.mail input[type=email] {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-hi);
    font-size: 15px;
    padding: 12px 20px;
    font-family: inherit;
  }
  form.mail input[type=email]::placeholder { color: #6e6b77; }

  form.mail button {
    position: relative;
    overflow: hidden;
    border: none;
    border-radius: 999px;
    padding: 0 28px;
    background: linear-gradient(135deg, var(--gold-hot), var(--gold-dim));
    color: #000;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    white-space: nowrap;
  }
  
  /* Shimmer effect on button */
  form.mail button::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: skewX(-20deg);
    transition: 0.5s;
  }
  form.mail button:hover::after {
    left: 150%;
    transition: 0.7s ease-in-out;
  }
  form.mail button:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 10px 25px rgba(231,184,102,0.4);
  }
  form.mail button:active { transform: translateY(0) scale(0.98); }

  .note {
    font-size: 13px;
    color: var(--text-lo);
    min-height: 18px;
    font-weight: 300;
  }
  .note.ok { color: var(--gold-hot); font-weight: 400; }

  footer {
    font-size: 12px;
    color: #5c5a63;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation-delay: 0.6s;
    font-weight: 700;
  }

  :focus-visible {
    outline: 2px solid var(--gold-hot);
    outline-offset: 4px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse-dot::after, .horizon, .title strong, .reveal, .num.flip, .cursor-glow { animation: none; transition: none; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <!-- Background Canvas Elements -->
  <div class="cursor-glow" id="cursorGlow"></div>
  <canvas id="globe"></canvas>
  <canvas id="comet"></canvas>
  <div class="stars"></div>
  <div class="horizon"></div>
  <div class="vignette"></div>

  <main class="wrap">
    <div class="eyebrow reveal">
      <span class="pulse-dot"></span>
      <span>Running live</span>
    </div>

    <h1 class="title reveal">Counting every second <br/><strong>since we began</strong></h1>

    <div class="ticker reveal" id="ticker">
      <div class="seg"><div class="num" id="v-y">00</div><div class="unit">Years</div></div>
      <div class="seg"><div class="num" id="v-mo">00</div><div class="unit">Months</div></div>
      <div class="seg"><div class="num" id="v-d">00</div><div class="unit">Days</div></div>
      <div class="seg"><div class="num" id="v-h">00</div><div class="unit">Hours</div></div>
      <div class="seg"><div class="num" id="v-mi">00</div><div class="unit">Minutes</div></div>
      <div class="seg tick"><div class="num" id="v-s">00</div><div class="unit">Seconds</div></div>
    </div>

    <p class="sub reveal">This number never stops. It started ticking the moment we launched, and it will keep going for as long as we do. Leave your email and we'll let you know when something changes.</p>

    <div class="capture reveal">
      <form class="mail" id="mailForm">
        <input type="email" id="mailInput" placeholder="you@email.com" required autocomplete="email">
        <button type="submit">Notify me</button>
      </form>
      <div class="note" id="mailNote">&nbsp;</div>
    </div>

    <footer class="reveal">EST. <span id="startLabel"></span></footer>
  </main>

<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= Interactive Cursor Glow ================= */
  (function(){
    if (reduceMotion) return;
    const cursorGlow = document.getElementById('cursorGlow');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let glowX = mouseX;
    let glowY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateGlow() {
      glowX += (mouseX - glowX) * 0.1; // Smooth interpolation
      glowY += (mouseY - glowY) * 0.1;
      cursorGlow.style.left = `${glowX}px`;
      cursorGlow.style.top = `${glowY}px`;
      requestAnimationFrame(animateGlow);
    }
    animateGlow();
  })();

  /* ================= Rotating Wireframe + Dot Globe ================= */
  (function(){
    const canvas = document.getElementById('globe');
    const ctx = canvas.getContext('2d');
    let W, H, R, DPR;

    function size(){
      DPR = Math.min(window.devicePixelRatio||1, 2);
      const dim = Math.min(window.innerWidth*1.3, window.innerHeight*1.3, 1040);
      W = H = dim;
      canvas.style.width = dim+'px';
      canvas.style.height = dim+'px';
      canvas.width = dim*DPR;
      canvas.height = dim*DPR;
      ctx.setTransform(DPR,0,0,DPR,0,0);
      R = dim*0.40;
    }
    size();
    window.addEventListener('resize', size);

    const LAT_STEPS = 14;
    const LON_STEPS = 26;
    const grid = [];
    for(let i=0;i<=LAT_STEPS;i++){
      const lat = Math.PI*(i/LAT_STEPS - 0.5);
      const row = [];
      for(let j=0;j<LON_STEPS;j++){
        const lon = Math.PI*2*j/LON_STEPS;
        row.push({
          x: Math.cos(lat)*Math.cos(lon),
          y: Math.sin(lat),
          z: Math.cos(lat)*Math.sin(lon)
        });
      }
      grid.push(row);
    }

    let mx = 0, my = 0;
    window.addEventListener('mousemove', e=>{
      mx = (e.clientX/window.innerWidth - 0.5);
      my = (e.clientY/window.innerHeight - 0.5);
    });

    let angle = 0;

    function project(p, cosA, sinA, tiltX){
      let x = p.x*cosA - p.z*sinA;
      let z = p.x*sinA + p.z*cosA;
      let y = p.y;
      const cosT = Math.cos(tiltX), sinT = Math.sin(tiltX);
      let y2 = y*cosT - z*sinT;
      let z2 = y*sinT + z*cosT;
      return {x, y:y2, z:z2};
    }

    function frame(){
      angle += reduceMotion ? 0 : 0.0015; // Slowed down slightly for elegance
      const tilt = 0.34 + my*0.15; // Reduced erratic mouse influence
      const yaw = angle + mx*0.2;

      ctx.clearRect(0,0,W,H);
      const cx = W/2, cy = H/2;
      const cosA = Math.cos(yaw), sinA = Math.sin(yaw);

      drawRing(cx, cy, true);

      const proj = grid.map(row => row.map(p => {
        const r = project(p, cosA, sinA, tilt);
        return { sx: cx + r.x*R, sy: cy + r.y*R, z: r.z };
      }));

      ctx.lineWidth = 1;
      for(let i=0;i<proj.length;i++){
        for(let j=0;j<LON_STEPS;j++){
          const a = proj[i][j];
          const b = proj[i][(j+1)%LON_STEPS];
          const depth = ((a.z+b.z)/2 +1)/2;
          if(depth < 0.42) continue;
          ctx.strokeStyle = `rgba(231,184,102,${(depth*0.16).toFixed(3)})`;
          ctx.beginPath();
          ctx.moveTo(a.sx, a.sy);
          ctx.lineTo(b.sx, b.sy);
          ctx.stroke();
        }
      }
      for(let j=0;j<LON_STEPS;j++){
        for(let i=0;i<proj.length-1;i++){
          const a = proj[i][j];
          const b = proj[i+1][j];
          const depth = ((a.z+b.z)/2 +1)/2;
          if(depth < 0.42) continue;
          ctx.strokeStyle = `rgba(231,184,102,${(depth*0.13).toFixed(3)})`;
          ctx.beginPath();
          ctx.moveTo(a.sx, a.sy);
          ctx.lineTo(b.sx, b.sy);
          ctx.stroke();
        }
      }

      let flat = [];
      for(const row of proj) for(const p of row) flat.push(p);
      flat.sort((a,b)=>a.z-b.z);
      for(const p of flat){
        const depth = (p.z+1)/2;
        const alpha = 0.1 + depth*0.8;
        const size = 0.7 + depth*2; // Slightly larger dots
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,${214+Math.round(depth*20)},${138+Math.round(depth*40)},${alpha.toFixed(3)})`;
        ctx.arc(p.sx, p.sy, size, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, R*1.001, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(231,184,102,0.16)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      drawRing(cx, cy, false);
      requestAnimationFrame(frame);
    }

    function drawRing(cx, cy, back){
      const rx = R*1.72, ry = R*0.42;
      const rot = -0.22;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.beginPath();
      if(back){
        ctx.ellipse(0,0, rx, ry, 0, Math.PI*0.08, Math.PI*0.92);
      } else {
        ctx.ellipse(0,0, rx, ry, 0, Math.PI*1.08, Math.PI*1.92);
      }
      const grad = ctx.createLinearGradient(-rx,0,rx,0);
      grad.addColorStop(0, 'rgba(231,184,102,0)');
      grad.addColorStop(0.5, `rgba(255,214,138,${back?0.25:0.6})`);
      grad.addColorStop(1, 'rgba(231,184,102,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = back? 1.4 : 2;
      ctx.stroke();
      ctx.restore();
    }

    frame();
  })();

  /* ================= Occasional Comet Streak ================= */
  (function(){
    if(reduceMotion) return;
    const canvas = document.getElementById('comet');
    const ctx = canvas.getContext('2d');
    let W,H,DPR;
    function size(){
      DPR = Math.min(window.devicePixelRatio||1,2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W*DPR; canvas.height = H*DPR;
      canvas.style.width=W+'px'; canvas.style.height=H+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
    }
    size();
    window.addEventListener('resize', size);

    let comet = null;
    function spawn(){
      comet = {
        x: Math.random()*W*0.6,
        y: -20,
        vx: 4+Math.random()*2.5,
        vy: 2.5+Math.random()*1.5,
        life: 0,
        max: 70+Math.random()*20
      };
    }
    let nextSpawn = 4000+Math.random()*6000;
    let last = performance.now();

    function loop(t){
      const dt = t-last; last=t;
      ctx.clearRect(0,0,W,H);

      nextSpawn -= dt;
      if(nextSpawn<=0 && !comet){ spawn(); nextSpawn = 7000+Math.random()*8000; }

      if(comet){
        comet.x += comet.vx; comet.y += comet.vy; comet.life++;
        const tailLen = 120;
        const grad = ctx.createLinearGradient(comet.x, comet.y, comet.x-comet.vx*tailLen/3, comet.y-comet.vy*tailLen/3);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(1, 'rgba(255,214,138,0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(comet.x, comet.y);
        ctx.lineTo(comet.x-comet.vx*tailLen/3, comet.y-comet.vy*tailLen/3);
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = '#ffffff';
        ctx.arc(comet.x, comet.y, 2, 0, Math.PI*2);
        ctx.fill();

        if(comet.life>comet.max || comet.x>W+40 || comet.y>H+40) comet=null;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();

  /* ================= Live Ticker ================= */
  const START = new Date("2026-03-04T04:14:28");
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  const prev = {};

  function diffParts(from, to){
    let y = to.getFullYear() - from.getFullYear();
    let mo = to.getMonth() - from.getMonth();
    let d = to.getDate() - from.getDate();
    let h = to.getHours() - from.getHours();
    let mi = to.getMinutes() - from.getMinutes();
    let s = to.getSeconds() - from.getSeconds();

    if(s < 0){ s += 60; mi--; }
    if(mi < 0){ mi += 60; h--; }
    if(h < 0){ h += 24; d--; }
    if(d < 0){
      const prevMonth = new Date(to.getFullYear(), to.getMonth(), 0).getDate();
      d += prevMonth;
      mo--;
    }
    if(mo < 0){ mo += 12; y--; }

    return {y, mo, d, h, mi, s};
  }

  function setVal(id, val){
    const el = $(id);
    const txt = pad(val);
    if(prev[id] !== txt){
      el.textContent = txt;
      if(prev[id] !== undefined && !reduceMotion){
        el.classList.remove('flip');
        void el.offsetWidth;
        el.classList.add('flip');
      }
      prev[id] = txt;
    }
  }

  function render(){
    const now = new Date();
    const p = diffParts(START, now);
    setVal('v-y', p.y);
    setVal('v-mo', p.mo);
    setVal('v-d', p.d);
    setVal('v-h', p.h);
    setVal('v-mi', p.mi);
    setVal('v-s', p.s);
  }

  render();
  setInterval(render, 1000);

  $('startLabel').textContent = START.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});

  /* ================= Email Form Handling ================= */
  const form = $('mailForm');
  const note = $('mailNote');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const val = $('mailInput').value.trim();
    if(!val) return;
    note.textContent = "You're on the list — thanks.";
    note.classList.add('ok');
    form.reset();
  });
</script>

</body>
</html>
